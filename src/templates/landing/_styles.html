  /* Hero CTA trio — primary gradient + glass-outline secondaries */
  .landing-hero-cta-row .landing-hero-cta {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    border-radius: 9999px;
    font-weight: 650;
    letter-spacing: -0.01em;
    transition:
      transform 0.2s cubic-bezier(0.34, 1.2, 0.64, 1),
      box-shadow 0.2s ease,
      border-color 0.2s ease,
      background-color 0.2s ease,
      color 0.2s ease;
  }
  .landing-hero-cta-row .landing-hero-cta:focus-visible {
    outline: 2px solid #22d3ee;
    outline-offset: 3px;
  }
  .landing-hero-cta-row .landing-hero-cta--start {
    border: 1px solid color-mix(in srgb, #22d3ee 35%, #002868);
    background-image: linear-gradient(120deg, #002868 0%, #0e7490 46%, #2d5a94 100%);
    background-color: transparent;
    color: #f8fcff;
    box-shadow:
      0 1px 2px color-mix(in srgb, #002868 28%, transparent),
      0 10px 28px color-mix(in srgb, #0e7490 32%, transparent),
      inset 0 1px 0 color-mix(in srgb, #ffffff 22%, transparent);
  }
  .landing-hero-cta-row .landing-hero-cta--start::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background: linear-gradient(120deg, #001f52 0%, #0b5566 48%, #1e3a5f 100%);
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .landing-hero-cta-row .landing-hero-cta--start::after {
    content: "";
    position: absolute;
    inset: -40% auto -40% -60%;
    width: 42%;
    background: linear-gradient(
      105deg,
      transparent 38%,
      color-mix(in srgb, #ffffff 28%, transparent) 50%,
      transparent 62%
    );
    transform: translateX(-180%) skewX(-18deg);
    transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
  }
  .landing-hero-cta-row .landing-hero-cta--start:hover {
    transform: translateY(-2px);
    box-shadow:
      0 2px 4px color-mix(in srgb, #002868 24%, transparent),
      0 16px 36px color-mix(in srgb, #0e7490 38%, transparent),
      inset 0 1px 0 color-mix(in srgb, #ffffff 28%, transparent);
  }
  .landing-hero-cta-row .landing-hero-cta--start:hover::before {
    opacity: 1;
  }
  .landing-hero-cta-row .landing-hero-cta--start:hover::after {
    transform: translateX(320%) skewX(-18deg);
  }

  .landing-hero-cta-row .landing-hero-cta--privacy:hover {

  .dark .landing-hero-cta-row .landing-hero-cta--start {

  .landing-cowork-threads {

  .landing-cowork-exchange {
    --claude-canvas: #faf9f5;
    --claude-ink: #1f1e1d;

    --claude-ink-muted: #8a8884;
    --claude-line: #e8e6e1;
    --claude-user-bg: #e8e6dc;

    --claude-tool-bg: #f3f2ee;
    --claude-report-bg: #ffffff;
    position: absolute;
    inset: 0;

    flex-direction: column;
    border-radius: inherit;
    background-color: var(--claude-canvas);

    animation: landing-carousel-card-cycle 30s ease-in-out infinite;

  .landing-cowork-threads.is-paused .landing-cowork-exchange {
    animation: none;
  }
  .landing-cowork-threads.is-paused .landing-cowork-exchange:not(.is-active) {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .landing-cowork-threads.is-paused .landing-cowork-exchange.is-active {
    opacity: 1;
    visibility: visible;
    transform: none;
    pointer-events: auto;
    z-index: 1;
  }
  .landing-cowork-threads:not(.is-paused) .landing-cowork-exchange {
    pointer-events: none;

  .landing-cowork-showcase.is-frozen:not([data-paused]) .landing-hero-tab .landing-hero-dot {
    animation-play-state: paused;

  @keyframes landing-carousel-card-cycle {
    0%,
    1.9% {

      z-index: 0;

    2%,

      opacity: 1;

    17%,

      transform: translateY(-6px);
      z-index: 0;
